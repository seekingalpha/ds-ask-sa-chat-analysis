[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-ask-sa-chat-analysis"
version = "0.0.1"
description = "Ask SA chat analysis: follow-up sentiment and entity extraction (NER) jobs"
readme = "README.md"
authors = [
    { name = "Andrii Shchur", email = "andriis@seekingalpha.com" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    # LLM stack: the versions the jobs were tested with in SageMaker
    "torch==2.8.0",
    "transformers==4.57.6",
    "accelerate==1.15.0",
    # data / AWS
    "pandas",
    "numpy",
    "pyyaml",
    "tqdm",
    "boto3",
    "redshift_connector",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["ds", "ask-sa", "sentiment", "ner"]

[project.urls]
Homepage = "https://github.com/seekingalpha/ds-ask-sa-chat-analysis"

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "flake8",
    "flake8-pyproject",
    "flake8-docstrings",
    "pre-commit",
]
build = [
    "boto3",
    "sagemaker>=2.200,<3",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 79
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 79
